# Локальный запуск API + Postgres + Vite одной командой из папки seashell:
#   docker compose up --build
# Перед первым запуском скопируй server/.env.example → server/.env и впиши GIGACHAT_API_KEY.
# DATABASE_URL для сервиса api задаётся ниже (хост db). Открой: http://localhost:5173  (API: http://localhost:3001)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seashell
      POSTGRES_PASSWORD: seashell
      POSTGRES_DB: seashell
    volumes:
      - seashell-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seashell -d seashell']
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://seashell:seashell@db:5432/seashell
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3001
    depends_on:
      - api
    restart: unless-stopped

volumes:
  seashell-pg:
